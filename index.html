<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narozeniny!</title>
  <script src="seznam.js"></script>
  <link rel="preload" href="Audio/celebration.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/5.mp3"  as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/6.mp3"  as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/7.mp3"  as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/8.mp3"  as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/9.mp3"  as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/10.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/11.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/12.mp3" as="audio" type="audio/mpeg">
  <link rel="preload" href="Audio/13.mp3" as="audio" type="audio/mpeg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; height: 100%; }

    body {
      background-color: #0a0a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Hero side portrait (left only) ── */
    #hero-left {
      position: fixed;
      top: 0;
      left: 0;
      width: 46%;
      height: 100%;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.8s ease;
      pointer-events: none;
      background-size: contain;
      background-position: left center;
      background-repeat: no-repeat;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 93%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 93%, transparent 100%);
    }
    #hero-left::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent 45%, #0a0a1a 88%);
      pointer-events: none;
    }

    /* ── Background canvases ── */
    #stars, #fireworks {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #stars     { z-index: 1; }
    #fireworks { z-index: 2; }

    /* ── Main content ── */
    #content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      text-align: center;
      padding: 32px 6vw 160px 4vw;
      width: 58vw;
    }

    #heading {
      font-size: clamp(22px, 4vw, 38px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.25;
      max-width: 900px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff9ff3, #ff6b6b);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 5s linear infinite;
    }

    #subheading {
      font-size: clamp(14px, 2vw, 20px);
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-top: -20px;
    }

    @keyframes gradientFlow {
      0%   { background-position: 0% center; }
      100% { background-position: 300% center; }
    }

    /* ── Countdown tiles ── */
    #countdown {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 32px 44px;
      min-width: 140px;
    }

    .tile-number {
      font-size: clamp(56px, 10vw, 80px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .tile-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .tile-sep {
      font-size: 64px;
      font-weight: 300;
      opacity: 0.3;
      line-height: 1;
      margin-bottom: 26px;
    }

    /* ── Balloons ── */
    .balloon {
      position: fixed;
      bottom: -140px;
      width: 70px;
      height: 88px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      z-index: 5;
      pointer-events: none;
      animation: floatUp var(--dur) ease-in forwards;
    }
    .balloon::before {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 14px solid var(--color);
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -70px;
      left: calc(50% - 0.5px);
      width: 1px;
      height: 56px;
      background: rgba(255,255,255,0.35);
    }

    @keyframes floatUp {
      0%   { transform: translateY(0)      translateX(0);    opacity: 1; }
      40%  { opacity: 1; }
      70%  { transform: translateY(-80vh)  translateX(var(--sway)); }
      100% { transform: translateY(-115vh) translateX(0);    opacity: 0; }
    }

    /* ── Celebration message ── */
    #celebration {
      display: none;
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 700;
      letter-spacing: 0.04em;
      animation: pulse 1.4s ease-in-out infinite;
    }

    #birthday-date {
      font-size: clamp(16px, 2.2vw, 24px);
      font-weight: 400;
      letter-spacing: 0.12em;
      opacity: 0.5;
      margin-top: -20px;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.07); opacity: 0.85; }
    }

    /* ── Up next strip ── */
    #strip {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 4;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 28px;
      padding: 24px 48px 28px;
      background: linear-gradient(to top, rgba(10,10,26,0.9) 50%, transparent);
    }

    .strip-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0.6;
      transition: opacity 0.6s;
    }

    .strip-item.next {
      opacity: 1;
    }

    .strip-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.02em;
      overflow: hidden;
    }

    .strip-item.next .strip-avatar {
      width: 88px;
      height: 88px;
      font-size: 28px;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.65);
    }

    .strip-name {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .strip-item.next .strip-name {
      font-size: 19px;
      font-weight: 600;
    }

    .strip-date {
      font-size: 13px;
      opacity: 0.7;
      letter-spacing: 0.04em;
    }

    .strip-item.next .strip-date {
      font-size: 15px;
      opacity: 0.9;
    }

    .strip-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* ── Naty fire sparks ── */
    .spark {
      position: fixed;
      bottom: 0;
      border-radius: 30% 30% 50% 50%;
      z-index: 4;
      pointer-events: none;
      transform-origin: center bottom;
      animation: sparkRise var(--dur) ease-out forwards;
    }

    @keyframes sparkRise {
      0%   { transform: translateY(0)      translateX(0);           opacity: 1; }
      50%  { opacity: 0.7; }
      100% { transform: translateY(-35vh)  translateX(var(--sway)); opacity: 0; }
    }

    .strip-item {
      cursor: pointer;
    }
    .strip-item:hover {
      opacity: 0.9 !important;
    }

    /* ── Person popup ── */
    #popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(10,10,26,0.82);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #popup-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #popup-card {
      position: relative;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 24px;
      padding: 44px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      max-width: 420px;
      width: 90%;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    #popup-photo {
      width: 300px;
      height: 380px;
      border-radius: 16px;
      object-fit: cover;
      object-position: center top;
      border: 1px solid rgba(255,255,255,0.2);
    }

    #popup-initials {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      font-weight: 700;
    }

    #popup-name {
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
    }

    #popup-celebrates {
      font-size: 15px;
      opacity: 0.6;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }

    #popup-date {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    #popup-days {
      font-size: 14px;
      opacity: 0.45;
      letter-spacing: 0.1em;
    }

    #popup-close {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 22px;
      opacity: 0.4;
      cursor: pointer;
      background: none;
      border: none;
      color: #fff;
      line-height: 1;
      transition: opacity 0.2s;
    }
    #popup-close:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div id="hero-left"></div>
  <canvas id="stars"></canvas>
  <canvas id="fireworks"></canvas>

  <div id="content">
    <p id="heading"></p>
    <p id="subheading">UŽ JEN ZA:</p>

    <div id="countdown">
      <div class="tile">
        <span class="tile-number" id="days">00</span>
        <span class="tile-label">Dní</span>
      </div>
      <span class="tile-sep">:</span>
      <div class="tile">
        <span class="tile-number" id="hours">00</span>
        <span class="tile-label">Hodin</span>
      </div>
      <span class="tile-sep">:</span>
      <div class="tile">
        <span class="tile-number" id="minutes">00</span>
        <span class="tile-label">Minut</span>
      </div>
      <span class="tile-sep">:</span>
      <div class="tile">
        <span class="tile-number" id="seconds">00</span>
        <span class="tile-label">Sekund</span>
      </div>
    </div>

    <p id="birthday-date"></p>
    <div id="celebration"></div>
  </div>

  <div id="strip"></div>

  <div id="popup-overlay">
    <div id="popup-card">
      <button id="popup-close">✕</button>
      <div id="popup-media"></div>
      <p id="popup-name"></p>
      <p id="popup-celebrates"></p>
      <p id="popup-date"></p>
      <p id="popup-days"></p>
    </div>
  </div>

  <script>
    /* ── Shared state ── */
    let isLastDay      = false;
    let TARGET         = null;
    let allPeople      = [];
    let currentPerson  = null;
    let celebFired     = false;

    const pad = n => String(n).padStart(2, '0');

    /* ════════════════════════════════════════
       STARFIELD
    ════════════════════════════════════════ */
    (function () {
      const canvas = document.getElementById('stars');
      const ctx    = canvas.getContext('2d');
      const COUNT  = 160;
      let stars    = [];

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      function buildStars() {
        stars = [];
        for (let i = 0; i < COUNT; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.4 + 0.3,
            minOp: Math.random() * 0.2 + 0.05,
            maxOp: Math.random() * 0.6 + 0.35,
            dur:   Math.random() * 4000 + 2000,
            offset: Math.random() * Math.PI * 2,
          });
        }
      }
      function draw(ts) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          const sin = (Math.sin((ts % s.dur) / s.dur * Math.PI * 2 + s.offset) + 1) / 2;
          const op  = s.minOp + (s.maxOp - s.minOp) * sin;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${op.toFixed(3)})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      window.addEventListener('resize', () => { resize(); buildStars(); });
      resize(); buildStars(); requestAnimationFrame(draw);
    })();

    /* ════════════════════════════════════════
       FIREWORKS
    ════════════════════════════════════════ */
    (function () {
      const canvas = document.getElementById('fireworks');
      const ctx    = canvas.getContext('2d');

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const COLORS = [
        '#ff6b6b','#ffd93d','#6bcb77','#4d96ff',
        '#ff9ff3','#ff922b','#a9e34b','#74c0fc',
        '#f783ac','#ffffff','#ffc9c9','#b2f2bb',
      ];

      class Particle {
        constructor(x, y, color) {
          this.x = x; this.y = y;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 5 + 1.5;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.color = color;
          this.alpha = 1;
          this.decay = Math.random() * 0.018 + 0.010;
          this.r     = Math.random() * 2.5 + 1;
          this.gravity = 0.08;
          this.trail = [];
        }
        update() {
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > 5) this.trail.shift();
          this.vy += this.gravity; this.vx *= 0.98;
          this.x += this.vx; this.y += this.vy;
          this.alpha -= this.decay;
        }
        draw(ctx) {
          ctx.save();
          for (let i = 0; i < this.trail.length; i++) {
            ctx.beginPath();
            ctx.arc(this.trail[i].x, this.trail[i].y, this.r * 0.5, 0, Math.PI * 2);
            ctx.fillStyle  = this.color;
            ctx.globalAlpha = (i / this.trail.length) * this.alpha * 0.4;
            ctx.fill();
          }
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
          ctx.fillStyle  = this.color;
          ctx.globalAlpha = Math.max(0, this.alpha);
          ctx.fill();
          ctx.restore();
        }
      }

      class Rocket {
        constructor() { this.reset(); }
        reset() {
          this.x  = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
          this.y  = canvas.height + 10;
          this.targetY = Math.random() * canvas.height * 0.5 + canvas.height * 0.05;
          const speed = Math.random() * 4 + 6;
          const dx = (Math.random() - 0.5) * 3, dy = -speed;
          const len = Math.sqrt(dx * dx + dy * dy);
          this.vx = dx / len * speed; this.vy = dy / len * speed;
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
          this.trail = []; this.exploded = false;
        }
        update(particles) {
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > 12) this.trail.shift();
          this.x += this.vx; this.y += this.vy; this.vy += 0.05;
          if (this.y <= this.targetY || this.vy >= 0) {
            const count = Math.floor(Math.random() * 10) + 15;
            for (let i = 0; i < count; i++)
              particles.push(new Particle(this.x, this.y, Math.random() < 0.2 ? '#ffffff' : this.color));
            this.exploded = true;
          }
        }
        draw(ctx) {
          ctx.save();
          for (let i = 0; i < this.trail.length; i++) {
            ctx.beginPath();
            ctx.arc(this.trail[i].x, this.trail[i].y, 2, 0, Math.PI * 2);
            ctx.fillStyle  = this.color;
            ctx.globalAlpha = i / this.trail.length * 0.8;
            ctx.fill();
          }
          ctx.beginPath();
          ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 1; ctx.fill();
          ctx.restore();
        }
      }

      let rockets = [], particles = [], lastLaunch = 0;
      let nextInterval = Math.random() * 4000 + 4000;

      function loop(ts) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (isLastDay && ts - lastLaunch > nextInterval) {
          rockets.push(new Rocket());
          if (Math.random() < 0.05) rockets.push(new Rocket());
          lastLaunch = ts;
          nextInterval = Math.random() * 4000 + 4000;
        }
        rockets = rockets.filter(r => {
          if (r.exploded) return false;
          r.update(particles);
          if (!r.exploded) r.draw(ctx);
          return !r.exploded;
        });
        particles = particles.filter(p => {
          p.update();
          if (p.alpha <= 0) return false;
          p.draw(ctx);
          return true;
        });
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();

    /* ════════════════════════════════════════
       BALLOONS
    ════════════════════════════════════════ */
    const BALLOON_COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff9ff3'];
    let balloonTimer = null, balloonWindowEnd = 0;

    function spawnBalloon() {
      const b = document.createElement('div');
      b.className = 'balloon';
      const color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
      const dur  = (Math.random() * 3 + 5).toFixed(1) + 's';
      const sway = (Math.random() * 80 - 40).toFixed(0) + 'px';
      const left = (Math.random() * 80 + 10).toFixed(0) + '%';
      b.style.cssText = `--color:${color};--dur:${dur};--sway:${sway};left:${left};background:${color};`;
      document.body.appendChild(b);
      b.addEventListener('animationend', () => b.remove());
    }

    function startBalloonWindow() {
      if (balloonTimer) clearInterval(balloonTimer);
      balloonWindowEnd = Date.now() + 25000;
      spawnBalloon(); spawnBalloon(); spawnBalloon();
      balloonTimer = setInterval(() => {
        if (Date.now() >= balloonWindowEnd) { clearInterval(balloonTimer); balloonTimer = null; return; }
        spawnBalloon();
      }, 1500);
    }

    /* ════════════════════════════════════════
       PEOPLE HELPERS
    ════════════════════════════════════════ */
    function nextBirthdayDate(day, month) {
      const now = new Date();
      const yr  = now.getFullYear();
      let d = new Date(yr, month - 1, day, 0, 0, 0);
      if (d <= now) d = new Date(yr + 1, month - 1, day, 0, 0, 0);
      return d;
    }

    function sortedPeople() {
      return allPeople
        .map(p => ({ ...p, target: nextBirthdayDate(p.day, p.month) }))
        .sort((a, b) => a.target - b.target);
    }

    function initials(name) {
      return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    function daysLabel(target) {
      const days = Math.ceil((target - Date.now()) / 86400000);
      if (days <= 0)  return 'dnes!';
      if (days === 1) return 'zítra';
      if (days <= 4)  return `za ${days} dny`;
      return `za ${days} dní`;
    }

    /* ════════════════════════════════════════
       STRIP
    ════════════════════════════════════════ */
    function renderStrip(items) {
      const strip = document.getElementById('strip');
      strip.innerHTML = '';
      items.forEach((p, i) => {
        const el = document.createElement('div');
        el.className = 'strip-item' + (i === 0 ? ' next' : '');
        el.dataset.personName = p.name;
        el.addEventListener('click', () => openPopup(p));
        const dateStr = `${p.day}.${String(p.month).padStart(2, '0')}.`;
        const avatarInner = p.photo
          ? `<img src="${p.photo}" alt="${p.name}">`
          : initials(p.name);
        el.innerHTML = `
          <div class="strip-avatar">${avatarInner}</div>
          <div class="strip-name">${p.name}</div>
          <div class="strip-date">${dateStr} · ${daysLabel(p.target)}</div>`;
        strip.appendChild(el);
      });
    }

    /* ════════════════════════════════════════
       HERO SETUP
    ════════════════════════════════════════ */
    function setupHero(person) {
      currentPerson = person;
      TARGET        = person.target;
      celebFired    = false;
      isLastDay     = false;

      const age = person.target.getFullYear() - person.birthYear;
      document.getElementById('heading').textContent =
        `${person.name} slaví ${age}. narozeniny!`;
      document.title = `${person.name} má narozeniny!`;

      const MONTHS = ['ledna','února','března','dubna','května','června',
                       'července','srpna','září','října','listopadu','prosince'];
      document.getElementById('birthday-date').textContent =
        `${person.day}. ${MONTHS[person.month - 1]}`;

      // Hero left portrait — crossfade
      const heroLeft = document.getElementById('hero-left');
      heroLeft.style.opacity = '0';
      setTimeout(() => {
        if (person.photo) {
          heroLeft.style.backgroundImage = `url('${person.photo}')`;
          heroLeft.style.opacity = '1';
        } else {
          heroLeft.style.backgroundImage = '';
        }
      }, 500);

      // Naty sparks
      if (person.name === 'Naty') startSparks();
      else stopSparks();

      document.getElementById('countdown').style.display     = '';
      document.getElementById('subheading').style.display    = '';
      document.getElementById('birthday-date').style.display = '';
      document.getElementById('celebration').style.display   = 'none';
    }

    /* ════════════════════════════════════════
       COUNTDOWN TICK
    ════════════════════════════════════════ */
    function tick() {
      if (!TARGET) return;
      const diff = TARGET - Date.now();

      if (diff <= 0) {
        if (!celebFired) { celebFired = true; triggerCelebration(); }
        return;
      }

      isLastDay = diff <= 86400000;

      const totalSec = Math.floor(diff / 1000);
      document.getElementById('days').textContent    = pad(Math.floor(totalSec / 86400));
      document.getElementById('hours').textContent   = pad(Math.floor(totalSec / 3600) % 24);
      document.getElementById('minutes').textContent = pad(Math.floor(totalSec / 60) % 60);
      document.getElementById('seconds').textContent = pad(totalSec % 60);

      setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
    }

    /* ════════════════════════════════════════
       CELEBRATION + AUTO-ADVANCE
    ════════════════════════════════════════ */
    function triggerCelebration() {
      stopSparks();
      document.getElementById('countdown').style.display      = 'none';
      document.getElementById('subheading').style.display     = 'none';
      document.getElementById('birthday-date').style.display  = 'none';
      const cel = document.getElementById('celebration');
      cel.textContent    = `🎉 ${currentPerson.name} slaví narozeniny! 🎉`;
      cel.style.display  = 'block';
      new Audio('Audio/celebration.mp3').play().catch(() => {});
      startBalloonWindow();

      // After 60 s move on to the next person
      setTimeout(() => {
        const sorted = sortedPeople();
        setupHero(sorted[0]);
        renderStrip(sorted.slice(1));
        tick();
      }, 60000);
    }

    /* ════════════════════════════════════════
       HOURLY ANNOUNCEMENT (last 24 h only)
    ════════════════════════════════════════ */
    (function () {
      const AVAILABLE = [5, 6, 7, 8, 9, 10, 11, 12, 13];
      let lastTriggeredHour = null;

      function playSequence(hoursLeft) {
        let played = false;
        function playHour() {
          if (played) return; played = true;
          setTimeout(() => {
            if (AVAILABLE.includes(hoursLeft))
              new Audio(`Audio/${hoursLeft}.mp3`).play().catch(() => {});
          }, 3000);
        }
        const cel = new Audio('Audio/celebration.mp3');
        cel.addEventListener('ended', playHour);
        cel.addEventListener('error', playHour);
        cel.play().catch(playHour);
        setTimeout(playHour, 45000);
      }

      function checkHour() {
        if (!TARGET || !isLastDay) return;
        const diff = TARGET - Date.now();
        if (diff <= 0) return;

        const totalSec  = Math.floor(diff / 1000);
        const hoursLeft = Math.floor(totalSec / 3600);
        const remainder = totalSec % 3600;

        if (remainder <= 6 && lastTriggeredHour !== hoursLeft) {
          lastTriggeredHour = hoursLeft;
          startBalloonWindow();
          playSequence(hoursLeft);
        }
      }

      setInterval(checkHour, 1000);
    })();

    /* ════════════════════════════════════════
       NATY SPARKS
    ════════════════════════════════════════ */
    const SPARK_COLORS = ['#ff4500','#ff6b00','#ffd700','#ff3300','#ffaa00','#fff4c2'];
    let sparkInterval = null;

    function spawnSpark() {
      const s     = document.createElement('div');
      s.className = 'spark';
      const color = SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)];
      const w     = (Math.random() * 2.5 + 1).toFixed(1) + 'px';
      const h     = (Math.random() * 5 + 3).toFixed(1) + 'px';
      const rot   = (Math.random() * 40 - 20).toFixed(0) + 'deg';
      const dur   = (Math.random() * 1.8 + 1.2).toFixed(1) + 's';
      const sway  = (Math.random() * 70 - 35).toFixed(0) + 'px';
      const left  = (Math.random() * 70 + 15).toFixed(0) + '%';
      s.style.cssText =
        `--dur:${dur};--sway:${sway};left:${left};width:${w};height:${h};background:${color};transform:rotate(${rot});`;
      document.body.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }

    function startSparks() {
      if (sparkInterval) return;
      sparkInterval = setInterval(spawnSpark, 420);
    }

    function stopSparks() {
      if (!sparkInterval) return;
      clearInterval(sparkInterval);
      sparkInterval = null;
    }

    /* ════════════════════════════════════════
       POPUP
    ════════════════════════════════════════ */
    const MONTHS_GEN = ['ledna','února','března','dubna','května','června',
                        'července','srpna','září','října','listopadu','prosince'];

    function openPopup(person) {
      const target = nextBirthdayDate(person.day, person.month);
      const age    = target.getFullYear() - person.birthYear;

      // Media
      const media = document.getElementById('popup-media');
      if (person.photo) {
        media.innerHTML = `<img id="popup-photo" src="${person.photo}" alt="${person.name}">`;
      } else {
        media.innerHTML = `<div id="popup-initials">${initials(person.name)}</div>`;
      }

      document.getElementById('popup-name').textContent =
        person.name;
      document.getElementById('popup-celebrates').textContent =
        `slaví ${age}. narozeniny`;
      document.getElementById('popup-date').textContent =
        `${person.day}. ${MONTHS_GEN[person.month - 1]}`;
      document.getElementById('popup-days').textContent =
        daysLabel(target).toUpperCase();

      document.getElementById('popup-overlay').classList.add('visible');
    }

    function closePopup() {
      document.getElementById('popup-overlay').classList.remove('visible');
    }

    // Close on overlay click (but not card click)
    document.getElementById('popup-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('popup-overlay')) closePopup();
    });
    document.getElementById('popup-close').addEventListener('click', closePopup);

    /* ════════════════════════════════════════
       INIT
    ════════════════════════════════════════ */
    function init() {
      allPeople = SEZNAM;

      const sorted = sortedPeople();
      setupHero(sorted[0]);
      renderStrip(sorted.slice(1));
      tick();
    }

    init();
  </script>
</body>
</html>
